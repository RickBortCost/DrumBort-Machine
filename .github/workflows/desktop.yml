name: Desktop host

# Host desktop C# (desktop/): test del motore audio (confronto con la web app), test
# end-to-end telefono ↔ PC, pacchetti self-contained per Windows, macOS e Linux.
# Richiamato anche da release.yml per allegare i pacchetti alla GitHub Release.
on:
  push:
    branches-ignore: [main]
    paths: ['desktop/**', 'js/**', 'index.html', 'css/**', 'tools/**', 'tests/remote.mjs', 'tests/desktop-compare.mjs', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'js/**', 'tools/**', '.github/workflows/desktop.yml']
  workflow_call:
    inputs:
      tag:
        description: "Release a cui allegare i pacchetti (es. v1.9.0); vuoto = solo artifact"
        type: string
        default: ''
      ref:
        description: "Commit o tag da compilare (vuoto = quello del workflow; per le release passate usare il tag)"
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: "Release a cui allegare i pacchetti (es. v1.9.0); vuoto = solo artifact"
        type: string
        default: ''
      ref:
        description: "Commit o tag da compilare (vuoto = quello del workflow; per le release passate usare il tag)"
        type: string
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci && npx playwright install --with-deps chromium
      - name: Asset del motore aggiornati
        run: node tools/export-dsp.mjs --check
      - name: Build
        run: dotnet build desktop -c Release
      - name: Build app Windows (WPF, compilata anche su Linux)
        run: dotnet build desktop/Win -c Release
      - name: Motore C# vs web app (voci, compressore, riverbero)
        run: |
          ./desktop/bin/Release/net8.0/DrumBortHost --render-voices voices.json
          node tests/desktop-compare.mjs voices.json
      - name: Telefono ↔ PC (nativo e relay)
        run: node tests/remote.mjs

  package:
    needs: test
    strategy:
      fail-fast: false        # un runner non disponibile (es. macOS) non blocca gli altri pacchetti
      matrix:
        include:
          # macOS compilato su Linux: i runner Mac di GitHub spesso non vengono assegnati.
          # Senza firma Apple: sul Mac un comando la aggiunge (vedi LEGGIMI).
          - { rid: win-x64, os: windows-latest, bundle: true }
          - { rid: osx-arm64, os: ubuntu-latest, bundle: false }
          - { rid: osx-x64, os: ubuntu-latest, bundle: false }
          - { rid: linux-x64, os: ubuntu-latest, bundle: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        shell: bash
        run: |
          # Windows: app nativa WPF (DrumBort.exe). macOS/Linux: host con finestra WebView.
          # Eseguibile singolo; su macOS la libreria audio resta accanto (si firma insieme all'eseguibile)
          proj=desktop; [ "${{ matrix.rid }}" = "win-x64" ] && proj=desktop/Win
          dotnet publish $proj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=${{ matrix.bundle }} -p:EnableCompressionInSingleFile=true -p:DebugType=none -o "out/DrumBortHost-${{ matrix.rid }}"
          cp desktop/README.md "out/DrumBortHost-${{ matrix.rid }}/LEGGIMI.md"
          ls -la "out/DrumBortHost-${{ matrix.rid }}"
          test -f "out/DrumBortHost-${{ matrix.rid }}/DrumBortHost" || test -f "out/DrumBortHost-${{ matrix.rid }}/DrumBort.exe"
      - name: Prova della finestra (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Apre la finestra con un progetto di prova, la salva in PNG ed esce (errore = codice ≠ 0)
          $p = Start-Process -FilePath "out/DrumBortHost-win-x64/DrumBort.exe" -ArgumentList "--selftest", "$PWD\selftest.png" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Error "La finestra non si chiude"; exit 1 }
          Get-Content "$env:LOCALAPPDATA\DrumBort\drumbort.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "Codice di uscita $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path selftest.png)) { Write-Error "Istantanea mancante"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: selftest-windows
          path: selftest.png
          retention-days: 14
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "out/DrumBortHost-${{ matrix.rid }}" -DestinationPath "DrumBortHost-${{ matrix.rid }}.zip"
      - name: Zip (macOS/Linux, con i permessi di esecuzione)
        if: runner.os != 'Windows'
        run: |
          chmod +x "out/DrumBortHost-${{ matrix.rid }}/DrumBortHost"
          cd out && zip -qry "../DrumBortHost-${{ matrix.rid }}.zip" "DrumBortHost-${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: DrumBortHost-${{ matrix.rid }}
          path: DrumBortHost-${{ matrix.rid }}.zip
          retention-days: 14
      # Ogni sistema allega il proprio zip appena pronto (un runner in coda non blocca gli altri)
      - name: Allega alla release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "DrumBortHost-${{ matrix.rid }}.zip" --repo "$GITHUB_REPOSITORY" --clobber
