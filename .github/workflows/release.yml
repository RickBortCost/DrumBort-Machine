name: Release

# Dopo un deploy riuscito (test verdi), se la versione in js/version.js non è ancora taggata:
# compila e testa i pacchetti desktop, poi crea tag e GitHub Release con i 4 eseguibili allegati.
# Se un pacchetto non si compila la release non viene pubblicata (si rilancia il workflow).
# Manualmente si può taggare una versione/commit specifici.
on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da taggare (es. 1.0.0). Vuoto = js/version.js"
        required: false
      ref:
        description: "Commit da taggare. Vuoto = HEAD di main"
        required: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.v.outputs.exists == 'false' }}
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read version
        id: v
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_REF: ${{ inputs.ref }}
        run: |
          V="$IN_VERSION"
          [ -z "$V" ] && V=$(grep -oE "[0-9]+\.[0-9]+\.[0-9]+" js/version.js | head -1)
          REF="$IN_REF"
          [ -z "$REF" ] && REF=$(git rev-parse HEAD)
          REF=$(git rev-parse --verify "$REF^{commit}")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$V già presente: nulla da fare."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # 1) Test e pacchetti desktop per Windows, macOS (Apple Silicon e Intel) e Linux, dal commit da rilasciare
  desktop:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ needs.release.outputs.ref }}

  # 2) La release si crea solo ora, con i 4 eseguibili già allegati (mai una release vuota)
  publish:
    needs: [release, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: DrumBortHost-*
          merge-multiple: true

      - name: Controlla i pacchetti
        run: |
          for r in win-x64 osx-arm64 osx-x64 linux-x64; do test -s "DrumBortHost-$r.zip" || { echo "Manca DrumBortHost-$r.zip"; exit 1; }; done
          ls -la DrumBortHost-*.zip

      - name: Extract changelog section
        env:
          V: ${{ needs.release.outputs.version }}
        run: |
          awk -v v="$V" '
            index($0, "## [" v "]") == 1 { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release v$V" > notes.md

      - name: Create tag and release (con gli eseguibili)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.release.outputs.version }}
          REF: ${{ needs.release.outputs.ref }}
        run: gh release create "v$V" DrumBortHost-*.zip --target "$REF" --title "v$V" --notes-file notes.md
